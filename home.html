<!DOCTYPE html>
<html><head><title>AI HR System</title>
<style>body{font-family:Arial;background:#f0f2f5;padding:20px} .card{background:white;padding:20px;margin:10px;border-radius:10px} button{background:#0b5fff;color:white;padding:10px;border:0;border-radius:5px}</style>
</head><body>
<h1>🤖 AI HR System</h1>
{% for job in jobs %}
<div class="card">
<h2>{{ job.title }}</h2>
<p>{{ job.description }}</p>
<p><b>Skills:</b> {{ job.required_skills }}</p>
<a href="/apply/{{ job.id }}/"><button>Apply</button></a>
</div>
{% endfor %}
<a href="/admin/">Admin Panel</a>
</body></html>
